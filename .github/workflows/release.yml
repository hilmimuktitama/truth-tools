name: Release

# Trusted publishing: the workflow builds and publishes only truth-tools using
# OIDC provenance. The private contracts workspace is validated but never published.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag to publish (for example, v0.3.1)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TRUTH_SUITE_COMPONENT_ROOT: ${{ github.workspace }}/components
      TRUTH_SUITE_REQUIRE_SIBLINGS: "1"
    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          test -n "$RELEASE_TAG"
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-tag.outputs.tag }}
          fetch-depth: 0
      - name: Resolve suite-lock refs
        id: suite-lock
        run: node scripts/suite-lock-verify.js --github-output --release >> "$GITHUB_OUTPUT"
      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          test "$head_commit" = "$tag_commit"
          version="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG#v}" = "$version"
      - uses: actions/checkout@v4
        with:
          repository: hilmimuktitama/capture-truth
          path: components/capture-truth
          ref: ${{ steps.suite-lock.outputs.capture_truth_ref }}
      - uses: actions/checkout@v4
        with:
          repository: hilmimuktitama/timeline-truth
          path: components/timeline-truth
          ref: ${{ steps.suite-lock.outputs.timeline_truth_ref }}
      - uses: actions/checkout@v4
        with:
          repository: hilmimuktitama/program-truth
          path: components/program-truth
          ref: ${{ steps.suite-lock.outputs.program_truth_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install npm 12.0.2 for trusted publishing
        run: |
          npm install --global npm@12.0.2
          npm --version
          test "$(npm --version)" = "12.0.2"
      - run: npm ci
      - name: Verify suite lock and checkout exact refs
        run: node scripts/suite-lock-verify.js --component-root "$TRUTH_SUITE_COMPONENT_ROOT" --verify-checkouts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check
      - run: npm run contracts:verify
      - run: npm run demo
      - run: npm run demo:build
      - run: npm run eval
      - run: npm run eval:synthetic
      - run: node bin/truth-tools.js doctor
      - name: Verify the root package allowlist and contents
        run: npm pack --dry-run
      - name: Verify the private contracts package
        run: (cd packages/contracts && npm pack --dry-run)
      - name: Publish truth-tools with provenance
        run: npm publish --provenance --access public
