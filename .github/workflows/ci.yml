name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TRUTH_SUITE_COMPONENT_ROOT: ${{ github.workspace }}/components
      TRUTH_SUITE_REQUIRE_SIBLINGS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Resolve suite-lock refs
        id: suite-lock
        run: node scripts/suite-lock-verify.js --github-output >> "$GITHUB_OUTPUT"
      - name: Checkout Truth Suite components
        uses: actions/checkout@v4
        with:
          repository: hilmimuktitama/capture-truth
          path: components/capture-truth
          ref: ${{ steps.suite-lock.outputs.capture_truth_ref }}
      - uses: actions/checkout@v4
        with:
          repository: hilmimuktitama/timeline-truth
          path: components/timeline-truth
          ref: ${{ steps.suite-lock.outputs.timeline_truth_ref }}
      - uses: actions/checkout@v4
        with:
          repository: hilmimuktitama/program-truth
          path: components/program-truth
          ref: ${{ steps.suite-lock.outputs.program_truth_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Verify suite lock and checkout exact refs
        run: node scripts/suite-lock-verify.js --component-root "$TRUTH_SUITE_COMPONENT_ROOT" --verify-checkouts --verify-contracts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check
      - run: npm run contracts:verify
      - run: npm run demo
      - run: npm run demo:build
      - run: node bin/truth-tools.js doctor
      - name: Verify quality and health gates on the broken example
        shell: bash
        run: |
          set +e
          node bin/truth-tools.js review \
            --input examples/product-launch.json \
            --format json \
            --fail-on fail > /tmp/truth-tools-example.json
          code=$?
          set -e
          test "$code" -eq 2
          grep -q '"artifact_quality": "fail"' /tmp/truth-tools-example.json
      - name: Verify the fixed evidence pack passes quality but fails the health gate
        shell: bash
        run: |
          set +e
          node bin/truth-tools.js review \
            --input examples/launch-readiness/evidence-pack.json \
            --format json \
            --fail-on-health blocked > /tmp/truth-tools-fixed.json
          code=$?
          set -e
          test "$code" -eq 2
          grep -q '"artifact_quality": "pass"' /tmp/truth-tools-fixed.json
          grep -q '"program_health": "blocked"' /tmp/truth-tools-fixed.json
      - run: npm run eval
      - run: npm run eval:synthetic
      - run: node bin/truth-tools.js example | node bin/truth-tools.js review --format json
      - run: npm pack --dry-run
