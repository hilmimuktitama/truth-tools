name: Pages

# Builds the static browser demo and deploys it to GitHub Pages.
# Deployment is scoped to the default branch and release tags only, so
# feature branches never trigger a deployment.
#
# This workflow is defined but not executed as part of the current branch
# work: enabling it is a repository-setting action (Pages source: GitHub
# Actions) described in docs/github-settings.md.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TRUTH_SUITE_COMPONENT_ROOT: ${{ github.workspace }}/components
      TRUTH_SUITE_REQUIRE_SIBLINGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hilmimuktitama/capture-truth
          path: components/capture-truth
      - uses: actions/checkout@v4
        with:
          repository: hilmimuktitama/timeline-truth
          path: components/timeline-truth
      - uses: actions/checkout@v4
        with:
          repository: hilmimuktitama/program-truth
          path: components/program-truth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run demo:build
      - run: npm run demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
